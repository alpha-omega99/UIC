# Blueprint Render. Version "test gratuit" : web gratuit + base PostgreSQL existante.
# La base est créée à part (Render > New > PostgreSQL, ou un fournisseur externe) ;
# son adresse est saisie dans Render (DATABASE_URL), jamais dans le code.
# Pour la production : passer le web en `plan: starter`, activer le disque ci-dessous
# (les fichiers téléversés y sont conservés) et prendre une base PostgreSQL payante.
services:
  - type: web
    name: uic-site
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_URL
        value: gestion-uic-change-moi/
      # Adresse de la base PostgreSQL : à saisir dans Render (Internal Database URL).
      - key: DATABASE_URL
        sync: false
      # Administrateur créé au build (offre gratuite sans Shell). Mot de passe : à saisir dans Render, jamais dans le code.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      # --- Production avec disque persistant (offre payante) : décommenter ---
      # - key: MEDIA_ROOT
      #   value: /var/data/media
      # - key: PRIVATE_MEDIA_ROOT
      #   value: /var/data/private_media
